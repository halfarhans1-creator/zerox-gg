name = "zerox-gg"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# the website itself (/public) is served by the same Worker; /username falls back to index.html
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/.netlify/*"]

# database + uploaded files (SQLite, free plan)
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# every 5 minutes: sync Discord badges (needs DISCORD_BOT_TOKEN)
[triggers]
crons = ["*/5 * * * *"]

# optional: restrict which sites may use the API (only needed if the frontend is on GitHub Pages)
# [vars]
# ALLOWED_ORIGINS = "https://USER.github.io"
